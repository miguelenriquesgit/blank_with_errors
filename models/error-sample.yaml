    "sql": "SELECT\n    SAFE_DIVIDE(COALESCE(SUM(marine_traffic.sessions ), 0), COALESCE(SUM(marine_traffic.users ), 0)) AS marine_traffic_snap_sessions_per_user\nFROM `honda-reporting.ga_reporting.marine_traffic`  AS marine_traffic\nWHERE ((( marine_traffic.time_stamp  ) >= ((TIMESTAMP_TRUNC(TIMESTAMP_TRUNC(CURRENT_TIMESTAMP(), DAY, 'UTC'), YEAR))) AND ( marine_traffic.time_stamp  ) < ((TIMESTAMP(DATETIME_ADD(DATETIME(TIMESTAMP_TRUNC(TIMESTAMP_TRUNC(CURRENT_TIMESTAMP(), DAY, 'UTC'), YEAR)), INTERVAL 1 YEAR)))))) AND ((DATE(marine_traffic.date )) BETWEEN (DATE(DATE_TRUNC(CURRENT_DATE('UTC'), YEAR))) AND (DATE(DATE_SUB(DATE_ADD(DATE_TRUNC(CURRENT_DATE('UTC'), YEAR), INTERVAL 1 YEAR), INTERVAL 1 DAY)  )) OR (DATE(marine_traffic.date )) BETWEEN (DATE(DATE_SUB(DATE_TRUNC(CURRENT_DATE('UTC'), YEAR), INTERVAL 1 YEAR) )) AND (DATE(DATE_SUB(DATE_SUB(DATE_ADD(DATE_TRUNC(CURRENT_DATE('UTC'), YEAR), INTERVAL 1 YEAR), INTERVAL 1 YEAR), INTERVAL 1 DAY)  ))) AND (marine_traffic.business_unit ) = 'Marine'\nLIMIT 500",
